<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#721727" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="HockeyApp" />
    <title>Hockey Team App</title>
    <script>
      // Apply the saved theme before first paint so there's no colour flash.
      // Keep the key and fallback in sync with src/lib/theme.ts.
      (function () {
        try {
          var t = localStorage.getItem('theme');
          document.documentElement.dataset.theme =
            t === 'clubhuis' || t === 'bordeaux' ? t : 'clubshirt';
        } catch (e) {
          document.documentElement.dataset.theme = 'clubshirt';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
